name: Check Compile
on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v3.3.0
      - uses: actions/setup-python@v4.6.0
        with:
          python-version: '3.8'
      - run: |
          python3 -m venv ./.venv
          source ./.venv/bin/activate
          pip install -e .
          python3 compile.py
      - uses: actions/upload-artifact@v3
        with:
          name: vspec_library.json
          path: vspec_library.json
